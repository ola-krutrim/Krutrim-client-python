# .github/workflows/publish-templates.yml
#
# Builds and publishes Krutrim Sandbox templates to ghcr.io/ola-krutrim/.
# Uses the Actions-provided GITHUB_TOKEN — no human PAT, nothing to rotate.
#
# Two phases: sandbox-base carries the BYOC contract, every template builds on it.
# Shared base layers dedupe in the registry and are cached on the node after the
# first pull, so a template costs little beyond its own layer.

name: Publish sandbox templates

on:
  push:
    tags: ['template-v*']
  workflow_dispatch:
    inputs:
      template:
        description: Build a single template (blank = all)
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: ola-krutrim

jobs:
  base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push sandbox-base
        uses: docker/build-push-action@v6
        with:
          context: .
          file: templates/_base/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/sandbox-base:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/sandbox-base:${{ github.ref_name }}
          cache-from: type=gha,scope=base
          cache-to: type=gha,mode=max,scope=base

  build:
    needs: base
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false        # one bad template must not stop the other twenty
      matrix:
        template: [aider, browser-playwright, bun, claude-code, code-interpreter, codex, computer-use, data-science, database, deno, documents, ffmpeg, golang, hermes, java, nodejs, opencode, php, ruby, rust, terminal-bench]
    steps:
      - uses: actions/checkout@v4

      - name: Skip if a single template was requested
        id: gate
        run: |
          want='${{ inputs.template }}'
          if [ -n "$want" ] && [ "$want" != '${{ matrix.template }}' ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.gate.outputs.skip != 'true'

      - name: Log in to GHCR
        if: steps.gate.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.gate.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: templates/${{ matrix.template }}/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            BASE_TAG=${{ github.ref_name }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/sandbox-${{ matrix.template }}:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/sandbox-${{ matrix.template }}:${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.template }}
          cache-to: type=gha,mode=max,scope=${{ matrix.template }}

      # Nothing used to assert the contract on a rebuild. `verify` proves the image is
      # anonymously pullable and nothing else — not /app, not the UID, not the port, not
      # $HOME. ENV HOME was missing from the base for the whole of template-v1.1.0 and
      # every job stayed green, so this step exists to make that class of regression loud.
      - name: Assert the BYOC contract on the built image
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          img="${REGISTRY}/${OWNER}/sandbox-${{ matrix.template }}:${{ github.ref_name }}"
          docker pull --platform linux/amd64 -q "$img"
          fail=0
          check() {  # name, expected, actual
            if [ "$2" = "$3" ]; then printf '  ok    %-12s %s\n' "$1" "$3"
            else printf '  FAIL  %-12s expected %s, got %s\n' "$1" "$2" "$3"; fail=1; fi
          }

          cfg=$(docker image inspect "$img")
          check workdir   "/app"           "$(echo "$cfg" | jq -r '.[0].Config.WorkingDir')"
          check user      "1000"           "$(echo "$cfg" | jq -r '.[0].Config.User')"
          check cmd       "sandbox-agent"  "$(echo "$cfg" | jq -r '.[0].Config.Cmd | join(" ")')"
          check port      "8871/tcp"       "$(echo "$cfg" | jq -r '.[0].Config.ExposedPorts | keys | join(" ")')"
          check arch      "amd64"          "$(echo "$cfg" | jq -r '.[0].Architecture')"

          home=$(echo "$cfg" | jq -r '.[0].Config.Env[]? | select(startswith("HOME="))' | head -1)
          if [ -n "$home" ]; then printf '  ok    %-12s %s\n' "home" "$home"
          else printf '  FAIL  %-12s HOME is not set; anything resolving ~ depends on a passwd entry\n' "home"; fail=1; fi

          # The agent binary has to exist and be executable, whatever else the image adds.
          if docker run --rm --entrypoint test "$img" -x /usr/local/bin/sandbox-agent; then
            printf '  ok    %-12s /usr/local/bin/sandbox-agent\n' "agent"
          else
            printf '  FAIL  %-12s agent binary missing or not executable\n' "agent"; fail=1
          fi

          # The one that actually matters: does it serve the health path the platform probes?
          # An image that fails this is accepted by create and then fails readiness.
          cid=$(docker run -d -p 18871:8871 "$img")
          ok=0
          for _ in $(seq 1 40); do
            if curl -fsS --max-time 2 http://127.0.0.1:18871/ >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" = 1 ]; then printf '  ok    %-12s GET / on 8871 answered\n' "health"
          else
            printf '  FAIL  %-12s no response on 8871 after 40s\n' "health"; fail=1
            docker logs "$cid" 2>&1 | tail -20
          fi
          docker rm -f "$cid" >/dev/null

          if [ "$fail" = 1 ]; then
            echo "::error::sandbox-${{ matrix.template }} does not satisfy the BYOC contract"
            exit 1
          fi

      # The contract gate above proves the image boots and answers. It says nothing about
      # whether the toolchain works. template-v1.2.0 shipped a rust image where
      # `rustc --version` was correct and `cargo build` failed with "linker `cc` not found" —
      # every job green. If a template declares a smoke test, run it in the built image.
      - name: Run the template smoke test
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          smoke="templates/${{ matrix.template }}/smoke.sh"
          if [ ! -f "$smoke" ]; then
            echo "::notice::no smoke.sh for ${{ matrix.template }} — capability is unasserted"
            exit 0
          fi
          img="${REGISTRY}/${OWNER}/sandbox-${{ matrix.template }}:${{ github.ref_name }}"
          # Mount read-only and run as the image's own user; the test writes under /tmp.
          if docker run --rm -v "$PWD/$smoke:/smoke.sh:ro" "$img" sh /smoke.sh; then
            echo "  smoke passed"
          else
            echo "::error::sandbox-${{ matrix.template }} built and booted but its toolchain does not work"
            exit 1
          fi

      # The contract requires <=4 GiB compressed. Fail loudly rather than at create time.
      - name: Check compressed size against the 4 GiB limit
        if: steps.gate.outputs.skip != 'true'
        run: |
          img="${REGISTRY}/${OWNER}/sandbox-${{ matrix.template }}:${{ github.ref_name }}"
          bytes=$(docker manifest inspect "$img" | jq '[.layers[].size] | add // 0')
          mib=$(( bytes / 1024 / 1024 ))
          echo "compressed layers: ${mib} MiB"
          if [ "$mib" -gt 4096 ]; then
            echo "::error::image exceeds the 4 GiB BYOC limit (${mib} MiB)"; exit 1
          fi

      # GitHub exposes no REST endpoint for package visibility, so this is best-effort.
      # A new package must be set public by hand, once, or the platform cannot pull it.
      - name: Remind that a new package must be made public
        if: steps.gate.outputs.skip != 'true'
        run: |
          echo "::notice::If sandbox-${{ matrix.template }} is new, set it public at" \
               "https://github.com/orgs/${OWNER}/packages/container/sandbox-${{ matrix.template }}/settings"

  verify:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Confirm anonymous pull works
        run: |
          # The platform pulls with no credentials. Prove that path, not an authenticated one.
          docker logout ghcr.io || true
          fail=0
          for t in aider browser-playwright bun claude-code code-interpreter codex computer-use data-science database deno documents ffmpeg golang hermes java nodejs opencode php ruby rust terminal-bench; do
            img="ghcr.io/${OWNER}/sandbox-${t}:${{ github.ref_name }}"
            if docker pull --platform linux/amd64 "$img" >/dev/null 2>&1; then
              echo "  ok        $img"
            else
              echo "  NOT PUBLIC $img"; fail=1
            fi
          done
          if [ "$fail" = 1 ]; then
            echo "::error::one or more templates are not anonymously pullable"; exit 1
          fi
