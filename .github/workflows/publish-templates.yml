# .github/workflows/publish-templates.yml
#
# Builds and publishes Krutrim Sandbox templates to ghcr.io/ola-krutrim/.
# Uses the Actions-provided GITHUB_TOKEN — no human PAT, nothing to rotate.
#
# Two phases: sandbox-base carries the BYOC contract, every template builds on it.
# Shared base layers dedupe in the registry and are cached on the node after the
# first pull, so a template costs little beyond its own layer.

name: Publish sandbox templates

on:
  push:
    tags: ['template-v*']
  workflow_dispatch:
    inputs:
      template:
        description: Build a single template (blank = all)
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: ola-krutrim

jobs:
  base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push sandbox-base
        uses: docker/build-push-action@v6
        with:
          context: .
          file: templates/_base/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/sandbox-base:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/sandbox-base:${{ github.ref_name }}
          cache-from: type=gha,scope=base
          cache-to: type=gha,mode=max,scope=base

  build:
    needs: base
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false        # one bad template must not stop the other twenty
      matrix:
        template: [aider, browser-playwright, bun, claude-code, code-interpreter, codex, computer-use, data-science, database, deno, documents, ffmpeg, golang, hermes, java, nodejs, opencode, php, ruby, rust, terminal-bench]
    steps:
      - uses: actions/checkout@v4

      - name: Skip if a single template was requested
        id: gate
        run: |
          want='${{ inputs.template }}'
          if [ -n "$want" ] && [ "$want" != '${{ matrix.template }}' ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.gate.outputs.skip != 'true'

      - name: Log in to GHCR
        if: steps.gate.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.gate.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: templates/${{ matrix.template }}/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            BASE_TAG=${{ github.ref_name }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/sandbox-${{ matrix.template }}:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/sandbox-${{ matrix.template }}:${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.template }}
          cache-to: type=gha,mode=max,scope=${{ matrix.template }}

      # The contract requires <=4 GiB compressed. Fail loudly rather than at create time.
      - name: Check compressed size against the 4 GiB limit
        if: steps.gate.outputs.skip != 'true'
        run: |
          img="${REGISTRY}/${OWNER}/sandbox-${{ matrix.template }}:${{ github.ref_name }}"
          bytes=$(docker manifest inspect "$img" | jq '[.layers[].size] | add // 0')
          mib=$(( bytes / 1024 / 1024 ))
          echo "compressed layers: ${mib} MiB"
          if [ "$mib" -gt 4096 ]; then
            echo "::error::image exceeds the 4 GiB BYOC limit (${mib} MiB)"; exit 1
          fi

      # GitHub exposes no REST endpoint for package visibility, so this is best-effort.
      # A new package must be set public by hand, once, or the platform cannot pull it.
      - name: Remind that a new package must be made public
        if: steps.gate.outputs.skip != 'true'
        run: |
          echo "::notice::If sandbox-${{ matrix.template }} is new, set it public at" \
               "https://github.com/orgs/${OWNER}/packages/container/sandbox-${{ matrix.template }}/settings"

  verify:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Confirm anonymous pull works
        run: |
          # The platform pulls with no credentials. Prove that path, not an authenticated one.
          docker logout ghcr.io || true
          fail=0
          for t in aider browser-playwright bun claude-code code-interpreter codex computer-use data-science database deno documents ffmpeg golang hermes java nodejs opencode php ruby rust terminal-bench; do
            img="ghcr.io/${OWNER}/sandbox-${t}:${{ github.ref_name }}"
            if docker pull --platform linux/amd64 "$img" >/dev/null 2>&1; then
              echo "  ok        $img"
            else
              echo "  NOT PUBLIC $img"; fail=1
            fi
          done
          if [ "$fail" = 1 ]; then
            echo "::error::one or more templates are not anonymously pullable"; exit 1
          fi
