        deployment_name:
          type: string
        account_id:
          type: string
        gpu_type:
          type: string
          example: nvidia.com/gpu
        min_replica:
          type: integer
        max_replica:
          type: integer
        region:
          type: string
        deploy_status:
          type: string
        total_gpu_seconds:
          type: number
          description: Cumulative billed GPU-seconds
        active_pods:
          type: integer
          description: Number of pods currently reporting DCGM metrics
        metrics:
          type: object
          properties:
            gpu_utilization:
              $ref: "#/components/schemas/MetricStream"
            framebuffer_used:
              $ref: "#/components/schemas/MetricStream"
            power_usage:
              $ref: "#/components/schemas/MetricStream"
    RuntimeResponse:
      type: object
      properties:
        id:
          type: string
          example: nodejs20.x
        name:
          type: string
          example: Node.js 20.x
        language:
          type: string
          example: nodejs
        fileExt:
          type: string
          example: function.js
        runCmd:
          type: string
        depFile:
          type: string
          example: package.json
        depCmd:
          type: string
          example: npm install
        defaultCode:
          type: string
