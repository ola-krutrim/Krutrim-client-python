    FunctionVersion:
      type: object
      properties:
        version_id:
          type: string
        version_number:
          type: integer
        image_uri:
          type: string
        image_digest:
          type: string
        status:
          type: string
        published_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
        build_metadata:
          type: object
          additionalProperties: true
        config_snapshot:
          type: object
          additionalProperties: true
        source_code:
          type: string
    ListFunctionVersionsResponse:
      type: object
      properties:
        status:
          type: integer
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/FunctionVersion"
        count:
          type: integer
    PublishFunctionVersionResponse:
      type: object
      properties:
        status:
          type: integer
        message:
          type: string
        data:
          $ref: "#/components/schemas/FunctionVersion"
    GetFunctionVersionResponse:
      type: object
      properties:
        status:
          type: integer
        message:
          type: string
        data:
          $ref: "#/components/schemas/FunctionVersion"
    FunctionAlias:
      type: object
      properties:
        alias_id:
          type: string
        alias_name:
          type: string
        version_id:
          type: string
        description:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateFunctionAliasRequest:
      type: object
      required:
        - alias_name
      properties:
        alias_name:
          type: string
        version_id:
          type: string
        version_number:
          type: integer
        description:
          type: string
    UpdateFunctionAliasRequest:
      type: object
      properties:
        version_id:
          type: string
        version_number:
          type: integer
        description:
          type: string
    FunctionAliasResponse:
      type: object
      properties:
        status:
          type: integer
        message:
          type: string
        data:
          $ref: "#/components/schemas/FunctionAlias"
    ListFunctionAliasesResponse:
      type: object
      properties:
        status:
          type: integer
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/FunctionAlias"
        count:
          type: integer
    FunctionTrafficUpdateRequest:
      type: object
      required:
        - weightedTargets
      properties:
        weightedTargets:
          type: array
          items:
            type: object
            required:
              - versionNumber
              - percent
            properties:
              versionNumber:
                type: integer
                minimum: 1
              percent:
                type: integer
                minimum: 0
                maximum: 100
    AliasRoutingUpdateRequest:
      type: object
      properties:
        weightedTargets:
          type: array
          items:
            type: object
            required:
              - versionNumber
              - percent
            properties:
              versionNumber:
                type: integer
                minimum: 1
              percent:
                type: integer
                minimum: 0
                maximum: 100
  responses:
    BadRequest:
      description: "Bad request \u2014 invalid input"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            status: 400
            error: Invalid request payload
            message: Field 'functionName' is required
    Unauthorized:
      description: "Unauthorized \u2014 missing or invalid credentials"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            status: 401
            error: Unauthorized
            message: x-account-id header is required
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            status: 404
            error: Not found
            message: No resource found with the given ID
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            status: 500
            error: Internal server error
            message: Unexpected failure
