        defaultDependencies:
          type: string
          description: Default dependency file content for this runtime
    ListRuntimesResponse:
      type: object
      properties:
        status:
          type: integer
          example: 200
        message:
          type: string
          example: Runtimes retrieved successfully
        data:
          type: array
          items:
            $ref: "#/components/schemas/RuntimeResponse"
    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
          example: 400
        error:
          type: string
          example: Invalid request payload
        message:
          type: string
