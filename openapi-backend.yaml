    CreateSandboxRequest:
      type: object
      description: |
        Request body for creating a sandbox. The runtime image is fixed and
        platform-provided — no image or template fields are accepted. Compute
        resources are selected via the required flavor.
      required:
        - sandboxName
        - region
        - flavorName
      properties:
        sandboxName:
          type: string
          description:
            Unique sandbox name within account. Must follow DNS-1035 (lowercase
            alphanumeric + hyphens, start with a letter).
          pattern: ^[a-z]([-a-z0-9]*[a-z0-9])?$
          example: my-sandbox
        region:
          type: string
          example: colo-1
        flavorName:
          type: string
          description: |
            Compute flavor name (same catalog as kpod — GET /omni/kpod/v1/flavors).
            Resolved server-side to cpu/memory; the flavor's region (subject)
            must match `region`. Sandboxes are CPU-only — GPU flavors are rejected.
          example: Omni-CPU-32x-128GB
        templateId:
          type: integer
          description: |
            Optional pod template ID. The template must support the sandbox
            service. If omitted, the first sandbox-supported template is used.
          example: 42
        templateName:
          type: string
          description: |
            Optional pod template name. The template must support the sandbox
            service. Cannot be provided together with templateId.
          example: python-runtime-sandbox
        networkStorages:
          type: array
          description: |
            Network storage volumes to attach (max 10; same shape as kpod/endpoint).
            Mount paths must be sub-paths of /app (default /app/volumes) so the
            filesystem API and file browser can reach the data; mounting at /app
            itself is rejected. Storage must be in the sandbox's region; the
            read-only flag is derived from the caller's access grant.
          items:
            $ref: "#/components/schemas/NetworkStorageAttachmentInput"
        environmentVariables:
          type: object
          additionalProperties:
            type: string
          description: Base64-encoded values per key
        ttlSeconds:
          type: integer
          minimum: 60
          maximum: 604800
          description: |
            Auto-expiry TTL. The sandbox is deleted this many seconds after it
            becomes active. Extendable via POST /sandbox/{id}/ttl (deadline
            resets to now + ttlSeconds). Omit for no expiry.
    SandboxResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: my-sandbox
        krn:
          type: string
          example: krn:lambda:colo-1:acc123:cust456:sandbox:01H8X7Y2Z3K4M5N6
        status:
          type: string
          enum:
            - deploying
            - active
            - deleting
            - failed_deploy
          example: active
        errorMessage:
          type: string
          description: Present when status is failed_deploy
        region:
          type: string
        serviceUrl:
          type: string
        imageUri:
          type: string
          description: Snapshot of the platform-provided runtime image
        flavorName:
          type: string
          description: Compute flavor selected at create time
        memory:
          type: integer
          description: Memory in MB
        noCpus:
          type: integer
        storage:
          type: integer
          description: Ephemeral storage in GB
        noGpus:
          type: integer
          description: GPUs resolved from the flavor (omitted for CPU flavors)
        gpuType:
          type: string
          description: GPU resource name resolved from the flavor
          example: nvidia.com/gpu
        networkStorages:
          type: array
          description: Attached network storage volumes (mount paths under /app)
          items:
            $ref: "#/components/schemas/NetworkStorageWorkflowInput"
        environmentVariables:
          type: object
          additionalProperties:
            type: string
        ttlSeconds:
          type: integer
          nullable: true
        expiresAt:
          type: string
          format: date-time
          description: Absolute auto-expiry deadline; present when a TTL is armed
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ListSandboxesResponse:
      type: object
      properties:
        status:
