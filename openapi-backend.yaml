openapi: 3.1.0
info:
  title: Krutrim Cloud Service API
  description:
    "Unified API for Krutrim Cloud Service \u2014 Lambda functions, Model Endpoints,\nNetwork\
    \ Storage, and KPod (AI workstation pods).\n\n**Architecture:**\n- Backend service (:7070) handles\
    \ all CRUD and lifecycle operations\n- Temporal workflows orchestrate all asynchronous operations\
    \ (build, deploy, etc.)\n- CP-Worker handles build, database, and audit operations\n- DP-Worker handles\
    \ deployment to Kubernetes/Knative clusters\n- MGR service (:7071) handles observability (logs, metrics,\
    \ usage, GPU metrics)\n  and internal analytics\n\n**Authentication:**\nAll non-internal endpoints\
    \ require:\n- `x-user-email`: user email address\n- `x-account-id`: account ID\n\nInternal endpoints\
    \ (`/internal/`) bypass authentication (`security: []`).\n"
  version: 2.0.0
  contact:
    name: Platform Team
    email: platform-team@krutrim.ai
servers:
  - url: http://localhost:7070
    description: "Backend \u2014 Local Development"
  - url: http://lambda-backend.serverless.svc.cluster.local:7070
    description: "Backend \u2014 Kubernetes Service"
tags:
  - name: Functions
    description: Lambda function lifecycle management
  - name: Runtimes
    description: Supported runtimes for Lambda functions
  - name: Invocation
    description: Function invocation
  - name: Endpoints
    description: Container inference endpoint (model deployment) management
  - name: Storage
    description: Network-attached persistent volumes
  - name: KPod
    description: AI workstation pod management
  - name: Sandbox
    description: Isolated execution environments with a fixed, platform-provided runtime image
  - name: Internal
    description: Internal platform endpoints (called by platform services, not end users)
  - name: Secrets
    description:
      Account-scoped credential storage (Vault-backed). Stores HuggingFace tokens, KOS access/secret
      keys, and Docker registry credentials. Endpoints reference stored secrets by name.
  - name: Observability
    description: Logs, metrics, and usage (served by MGR :7071)
  - name: Analytics
    description: Account/region analytics for internal dashboards (served by MGR :7071)
  - name: Health
    description: Service health and readiness checks
  - name: Queue
    description: Queue task submission and management
security:
  - ApiHeaders: []
paths:
  /omni/functions/v1/runtimes:
    get:
      tags:
        - Runtimes
      summary: List supported runtimes
      operationId: listRuntimes
      responses:
        "200":
          description: Runtimes retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListRuntimesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /omni/functions/v1/functions:
    get:
      tags:
        - Functions
      summary: List Lambda functions
      description: |
        Returns all active Lambda functions for the authenticated account.
        Supports optional region, status, and name filtering and pagination.
        When `limit` is omitted all matching functions are returned.
      operationId: listFunctions
      parameters:
        - $ref: "#/components/parameters/QueryRegion"
        - $ref: "#/components/parameters/QueryStatus"
        - $ref: "#/components/parameters/QueryName"
        - $ref: "#/components/parameters/QueryPage"
        - $ref: "#/components/parameters/QueryLimit"
      responses:
        "200":
          description: Functions retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListFunctionsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags:
        - Functions
      summary: Create a Lambda function
      description:
        "Creates a new Lambda function. Initiates a Temporal workflow that saves\nmetadata,\
        \ builds a Docker image (CP-Worker), and deploys to\nKubernetes/Knative (DP-Worker).\n\nReturns\
        \ 202 Accepted. Status transitions: pending \u2192 building \u2192 deploying \u2192 active.\n"
      operationId: createFunction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFunctionRequest"
      responses:
        "202":
          description: Function creation initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncFunctionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /omni/functions/v1/functions/{id}:
    get:
      tags:
        - Functions
      summary: Get a Lambda function by ID
      operationId: getFunction
      parameters:
        - $ref: "#/components/parameters/FunctionID"
      responses:
        "200":
          description: Function retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  data:
                    $ref: "#/components/schemas/FunctionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags:
        - Functions
      summary: Update a Lambda function
      description: |
        Updates an existing function's configuration and/or source code.
        Returns 202 Accepted. Actual update happens asynchronously.
      operationId: updateFunction
      parameters:
        - $ref: "#/components/parameters/FunctionID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFunctionRequest"
      responses:
        "202":
          description: Function update initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncFunctionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags:
        - Functions
      summary: Delete a Lambda function
      description: |
        Deletes a function and cleans up all associated resources.
        Returns 202 Accepted. Soft-deletes the record after cleaning up K8s resources.
      operationId: deleteFunction
      parameters:
        - $ref: "#/components/parameters/FunctionID"
      responses:
        "202":
          description: Function deletion initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /omni/functions/v1/functions/{id}/build:
    post:
      tags:
        - Functions
      summary: Build a Lambda function image
      description: |
        Triggers a Docker image build for the function.
        Function must be in `draft`, `built`, or `failed_build` state.
      operationId: buildFunction
      parameters:
        - $ref: "#/components/parameters/FunctionID"
      responses:
        "202":
          description: Build initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncFunctionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /omni/functions/v1/functions/{id}/deploy:
    post:
      tags:
        - Functions
      summary: Deploy a Lambda function
      description: |
        Deploys a built function image to the workload cluster.
        Function must have `imageUri` set and be in `built`, `active`, or `failed_deploy` state.
      operationId: deployFunction
      parameters:
        - $ref: "#/components/parameters/FunctionID"
      responses:
        "202":
          description: Deployment initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncFunctionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /omni/functions/v1/functions/{id}/invoke:
    post:
      tags:
        - Invocation
      summary: Invoke a Lambda function
      operationId: invokeFunction
      parameters:
        - $ref: "#/components/parameters/FunctionID"
        - name: X-Invocation-Type
          in: header
          required: false
          schema:
            type: string
            enum:
              - synchronous
              - asynchronous
            default: synchronous
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvokeFunctionRequest"
      responses:
        "200":
          description: Function invoked successfully (synchronous)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvokeFunctionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Forbidden
        "502":
          description: Function invocation failed at upstream function service
      description: Synchronously invokes a deployed function and returns the function response payload.
  /omni/functions/v1/internal/stop:
    post:
      tags:
        - Internal
      summary: Stop all Lambda functions for an account
      description: |
        Stops all deployed functions for the given account by removing their
        Knative deployments and service URLs. Called by platform services
        (e.g. credit management). Returns 202 Accepted.
      operationId: stopAllFunctions
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkStopRequest"
      responses:
        "202":
          description: Bulk stop initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkStopResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /omni/functions/v1/internal/resume:
    post:
      tags:
        - Internal
      summary: Resume all stopped Lambda functions for an account
      description: |
        Resumes all stopped functions for the given account by redeploying
        the previously built image via Knative. Skips functions that are not
        in `stopped` state or that have no built image. Returns 202 Accepted.
      operationId: resumeAllFunctions
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkResumeRequest"
      responses:
        "202":
          description: Bulk resume initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkResumeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /omni/functions/v1/internal/terminate:
    post:
      tags:
        - Internal
      summary: Terminate (delete) all Lambda functions for an account
      description: |
        Deletes all functions for the given account. Called by platform services
        (e.g. account deprovisioning). Returns 202 Accepted.
      operationId: terminateAllFunctions
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkTerminateRequest"
      responses:
        "202":
          description: Bulk terminate initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkTerminateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /omni/endpoints/v1/endpoint:
    get:
      tags:
        - Endpoints
      summary: List model endpoints
      operationId: listEndpoints
      parameters:
        - $ref: "#/components/parameters/QueryRegion"
        - $ref: "#/components/parameters/QueryStatus"
        - $ref: "#/components/parameters/QueryName"
        - $ref: "#/components/parameters/QueryPage"
        - $ref: "#/components/parameters/QueryLimit"
      responses:
        "200":
          description: Endpoints retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEndpointsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags:
        - Endpoints
      summary: Create a model endpoint
      description: |
        Creates a new container inference endpoint.
        Returns 202 Accepted. Deployment is asynchronous via Temporal workflow.

        Set `cacheModel: true` with `modelSource` ("huggingface" or "kos") to
        automatically download and cache a model before the container starts.
      operationId: createEndpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEndpointRequest"
      responses:
        "202":
          description: Endpoint deployment initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncDeploymentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /omni/endpoints/v1/endpoint/{id}:
    get:
      tags:
        - Endpoints
      summary: Get a model endpoint by ID or KRN
      operationId: getEndpoint
      parameters:
        - $ref: "#/components/parameters/DeploymentID"
      responses:
        "200":
          description: Endpoint retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  data:
                    $ref: "#/components/schemas/DeploymentResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags:
        - Endpoints
      summary: Update a model endpoint
      description: |
        Updates an existing endpoint configuration and triggers a re-deploy.
        Returns 202 Accepted. Cannot update while deploy_status is `deploying` or `deleting`.
      operationId: updateEndpoint
      parameters:
        - $ref: "#/components/parameters/DeploymentID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEndpointRequest"
      responses:
        "202":
          description: Endpoint update initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncDeploymentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Endpoint is currently deploying or being deleted
    delete:
      tags:
        - Endpoints
      summary: Delete a model endpoint
      operationId: deleteEndpoint
      parameters:
        - $ref: "#/components/parameters/DeploymentID"
      responses:
        "202":
          description: Endpoint deletion initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /omni/endpoints/v1/internal/endpoint/stop:
    post:
      tags:
        - Internal
      summary: Stop all endpoints for an account
      operationId: stopAllEndpoints
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkStopRequest"
      responses:
        "202":
          description: Bulk stop initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkEndpointOpResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /omni/endpoints/v1/internal/endpoint/terminate:
    post:
      tags:
        - Internal
      summary: Terminate (delete) all endpoints for an account
      operationId: terminateAllEndpoints
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkTerminateRequest"
      responses:
        "202":
          description: Bulk terminate initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkEndpointOpResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /omni/storage/v1/storages:
    get:
      tags:
        - Storage
      summary: List network storages
      description: Returns all storages owned by or shared with the account.
      operationId: listStorages
      parameters:
        - $ref: "#/components/parameters/QueryRegion"
      responses:
        "200":
          description: Storages retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      rows:
                        type: array
                        items:
                          $ref: "#/components/schemas/StorageResponse"
                      total:
                        type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags:
        - Storage
      summary: Create a network storage volume
      description: |
        Provisions a PVC-backed network storage volume.
        Returns 201 with status `creating`. The volume becomes `ready` once the
        dp-worker PVC provisioning workflow completes.
      operationId: createStorage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStorageRequest"
      responses:
        "201":
          description: Storage created (provisioning in progress)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 201
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/StorageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /omni/storage/v1/storages/{id}:
    get:
      tags:
        - Storage
      summary: Get a storage volume by ID
      description: Accessible by the owner or any account with an active access grant.
      operationId: getStorage
      parameters:
        - $ref: "#/components/parameters/StorageID"
      responses:
        "200":
          description: Storage retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  data:
                    $ref: "#/components/schemas/StorageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags:
        - Storage
      summary: Delete a storage volume
      description: |
        Soft-deletes the record and triggers async PVC cleanup on the dp-worker.
        Only the owner can delete.
      operationId: deleteStorage
      parameters:
        - $ref: "#/components/parameters/StorageID"
      responses:
        "200":
          description: Storage deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not the storage owner
        "404":
          $ref: "#/components/responses/NotFound"
  /omni/storage/v1/storages/{id}/access:
    get:
      tags:
        - Storage
      summary: List access grants for a storage volume
      description: Only the owner can list grants.
      operationId: listStorageAccess
      parameters:
        - $ref: "#/components/parameters/StorageID"
      responses:
        "200":
          description: Access grants retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AccessGrantResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not the storage owner
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags:
        - Storage
      summary: Grant access to a storage volume
      description: |
        Creates or updates an access grant for another account.
        `accessLevel` must be `read-write` or `read-only`.
        Only the owner can grant access.
      operationId: grantStorageAccess
      parameters:
        - $ref: "#/components/parameters/StorageID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrantAccessRequest"
      responses:
        "201":
          description: Access granted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 201
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/AccessGrantResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not the storage owner
        "404":
          $ref: "#/components/responses/NotFound"
  /omni/storage/v1/storages/{id}/access/{grantId}:
    delete:
      tags:
        - Storage
      summary: Revoke an access grant
      description: Only the owner can revoke grants.
      operationId: revokeStorageAccess
      parameters:
        - $ref: "#/components/parameters/StorageID"
        - name: grantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Access grant UUID
      responses:
        "200":
          description: Access revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not the storage owner
        "404":
          $ref: "#/components/responses/NotFound"
  /omni/kpod/v1/pod:
    get:
      tags:
        - KPod
      summary: List AI workstation pods
      operationId: listPods
      parameters:
        - $ref: "#/components/parameters/QueryRegion"
        - $ref: "#/components/parameters/QueryStatus"
        - $ref: "#/components/parameters/QueryName"
        - $ref: "#/components/parameters/QueryPage"
        - $ref: "#/components/parameters/QueryLimit"
      responses:
        "200":
          description: Pods retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListPodsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags:
        - KPod
      summary: Create a KPod
      description: Provisions an AI workstation pod. Returns 202 Accepted.
      operationId: createPod
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePodRequest"
      responses:
        "202":
          description: Pod creation initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncDeploymentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /omni/kpod/v1/pod/{id}:
    get:
      tags:
        - KPod
      summary: Get a KPod by ID
      operationId: getPod
      parameters:
        - $ref: "#/components/parameters/PodID"
      responses:
        "200":
          description: Pod retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/PodResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags:
        - KPod
      summary: Update a KPod
      description: |
        Updates mutable pod configuration (volumes, ports, pod template, env vars, VPC, SSH/Jupyter toggles).
        Cannot change flavor, name, or region. Returns 202 Accepted.
      operationId: updatePod
      parameters:
        - $ref: "#/components/parameters/PodID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePodRequest"
      responses:
        "202":
          description: Pod update initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncDeploymentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Pod is currently deploying or being stopped
    delete:
      tags:
        - KPod
      summary: Delete a KPod
      operationId: deletePod
      parameters:
        - $ref: "#/components/parameters/PodID"
      responses:
        "202":
          description: Pod deletion initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /omni/kpod/v1/pod/{id}/stop:
    post:
      tags:
        - KPod
      summary: Stop a KPod
      description: Stops the pod (scales to zero). Pod must be in `active` or `updating` state.
      operationId: stopPod
      parameters:
        - $ref: "#/components/parameters/PodID"
      responses:
        "202":
          description: Pod stop initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Pod is already stopped or being stopped
  /omni/kpod/v1/pod/{id}/resume:
    post:
      tags:
        - KPod
      summary: Resume a stopped KPod
      description: Restarts a stopped pod. Pod must be in `stopped` state.
      operationId: resumePod
      parameters:
        - $ref: "#/components/parameters/PodID"
      responses:
        "202":
          description: Pod resume initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 202
                  message:
                    type: string
                  workflowId:
                    type: string
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      name:
                        type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Pod is not stopped
  /omni/kpod/v1/internal/pod/terminate:
    post:
      tags:
        - Internal
      summary: Terminate all KPods for an account
      description: |
        If body contains `accountId`, terminates all pods for that account.
        This endpoint reads auth headers for the operator's account context.
      operationId: terminatePod
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkTerminateRequest"
      responses:
        "202":
          description: Bulk terminate initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkPodOpResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /omni/kpod/v1/internal/pod/stop:
    post:
      tags:
        - Internal
      summary: Stop all KPods for an account
      description: |
        Bulk-stops all AI Pods for the given account by tearing down their
        Kubernetes workloads while preserving DB state (so they can be resumed).
        Called by platform services (e.g. billing on insufficient credit).
        Returns 202 Accepted.
      operationId: stopAllPods
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkStopRequest"
      responses:
        "202":
          description: Bulk stop initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkPodOpResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /omni/kpod/v1/internal/pod/resume:
    post:
      tags:
        - Internal
      summary: Resume all stopped KPods for an account
      description: |
        Bulk-resumes all stopped AI Pods for the given account by redeploying
        their Kubernetes workloads from saved DB state. Skips pods not in
        `stopped` state. Returns 202 Accepted.
      operationId: resumeAllPods
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkResumeRequest"
      responses:
        "202":
          description: Bulk resume initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkResumeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /omni/kpod/v1/gpuresource:
    get:
      tags:
        - KPod
      summary: List GPU node snapshots
      description: |
        Returns persisted GPU availability data from the cluster.
        Query: `?cluster=` to filter by cluster; `?limit=` (default 500, max 5000).
      operationId: getGpuResources
      security: []
      parameters:
        - name: cluster
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 500
            maximum: 5000
      responses:
        "200":
          description: GPU resources retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/GpuResourceItem"
  /omni/kpod/v1/flavors:
    get:
      tags:
        - KPod
      summary: List available pod flavors
      description:
        Returns active flavors from the flavor store. Filter by `?region=` to restrict to a
        region.
      operationId: listPodFlavors
      parameters:
        - $ref: "#/components/parameters/QueryRegion"
      responses:
        "200":
          description: Flavors retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/FlavorItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /omni/endpoints/v1/podtemplate:
    get:
      tags:
        - Endpoints
      summary: List official pod templates (Endpoint)
      description:
        Returns official templates visible to the Endpoint service (supported_services includes
        "endpoint" or is empty).
      operationId: listEndpointTemplates
      responses:
        "200":
          description: Pod templates retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PodTemplate"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /omni/endpoints/v1/podtemplate/{id}:
    get:
      tags:
        - Endpoints
      summary: Get a pod template by ID (Endpoint)
      operationId: getEndpointTemplateById
      parameters:
        - $ref: "#/components/parameters/TemplateID"
      responses:
        "200":
          description: Pod template retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PodTemplate"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /omni/podtemplate/v1/official:
    get:
      tags:
        - PodTemplate
      summary: List all official pod templates (admin)
      description:
        Returns all official templates regardless of `supported_services`. Intended for admin/management
        UI only.
      operationId: listAllPodTemplates
      responses:
        "200":
          description: All pod templates retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PodTemplate"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags:
        - PodTemplate
      summary: Create an official pod template (admin)
      description: |
        Creates a new official pod template.

        **Service-field validation:**
        - `require_model_source` is only valid when `supported_services` includes `"endpoint"`.
        - `enable_ssh` and `enable_jupyter` are only valid when `supported_services` includes `"aipod"`.
        - `template_type` is always set to `"official"`.
      operationId: createPodTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PodTemplateInput"
      responses:
        "201":
          description: Pod template created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PodTemplate"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /omni/podtemplate/v1/official/{id}:
    get:
      tags:
        - PodTemplate
      summary: Get an official pod template by ID
      operationId: getPodTemplateById
      parameters:
        - $ref: "#/components/parameters/TemplateID"
      responses:
        "200":
          description: Pod template retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PodTemplate"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags:
        - PodTemplate
      summary: Update an official pod template (admin)
      description: |
        Updates an existing official pod template.

        **Service-field validation:**
        - `require_model_source` is only valid when `supported_services` includes `"endpoint"`.
        - `enable_ssh` and `enable_jupyter` are only valid when `supported_services` includes `"aipod"`.
      operationId: updatePodTemplate
      parameters:
        - $ref: "#/components/parameters/TemplateID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PodTemplateInput"
      responses:
        "200":
          description: Pod template updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PodTemplate"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags:
        - PodTemplate
      summary: Delete an official pod template (admin)
      operationId: deletePodTemplate
      parameters:
        - $ref: "#/components/parameters/TemplateID"
      responses:
        "204":
          description: Pod template deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /omni/podtemplate/v1/{service}:
    get:
      tags:
        - KPod
        - Endpoints
      summary: List official templates for a service
      description: Returns official templates for the given service (`aipod` or `endpoint`).
      operationId: listTemplatesByService
      parameters:
        - $ref: "#/components/parameters/ServiceParam"
      responses:
        "200":
          description: Templates retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PodTemplate"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /omni/podtemplate/v1/{service}/first:
    get:
      tags:
        - KPod
        - Endpoints
      summary: Get the first (default) template for a service
      operationId: getFirstTemplateByService
      parameters:
        - $ref: "#/components/parameters/ServiceParam"
      responses:
        "200":
          description: First template retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PodTemplate"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /omni/podtemplate/v1/{service}/{id}:
    get:
      tags:
        - KPod
        - Endpoints
      summary: Get a template by ID for a service
      operationId: getTemplateByServiceAndId
      parameters:
        - $ref: "#/components/parameters/ServiceParam"
        - $ref: "#/components/parameters/TemplateID"
      responses:
        "200":
          description: Template retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PodTemplate"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /omni/podtemplate/v1/{service}/private:
    get:
      tags:
        - KPod
        - Endpoints
      summary: List private templates
      description:
        Returns the caller's private templates for the given service. Requires `x-account-id`
        header.
      operationId: listPrivateTemplates
      parameters:
        - $ref: "#/components/parameters/ServiceParam"
      responses:
        "200":
          description: Private templates retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PodTemplate"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags:
        - KPod
        - Endpoints
      summary: Create a private template
      description:
        "Creates a caller-owned private template for the given service.\n\n- `supported_services`\
        \ is automatically set to `[service]` \u2014 the request value is ignored.\n- `template_type`\
        \ is automatically set to `\"private\"`.\n- `account_id` and `user_id` are set from the identity\
        \ headers.\n\n**Service-field validation:**\n- `require_model_source` is only valid for the `endpoint`\
        \ service.\n- `enable_ssh` and `enable_jupyter` are only valid for the `aipod` service.\n"
      operationId: createPrivateTemplate
      parameters:
        - $ref: "#/components/parameters/ServiceParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PodTemplateInput"
      responses:
        "201":
          description: Private template created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PodTemplate"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /omni/podtemplate/v1/{service}/private/{id}:
    get:
      tags:
        - KPod
        - Endpoints
      summary: Get a private template by ID
      description: Returns the template only if it belongs to the caller's account.
      operationId: getPrivateTemplateById
      parameters:
        - $ref: "#/components/parameters/ServiceParam"
        - $ref: "#/components/parameters/TemplateID"
      responses:
        "200":
          description: Private template retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PodTemplate"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags:
        - KPod
        - Endpoints
      summary: Update a private template
      description: |
        Updates the caller's private template. `supported_services`, `template_type`, `account_id`, and `user_id` cannot be changed.

        **Service-field validation:**
        - `require_model_source` is only valid for the `endpoint` service.
        - `enable_ssh` and `enable_jupyter` are only valid for the `aipod` service.
      operationId: updatePrivateTemplate
      parameters:
        - $ref: "#/components/parameters/ServiceParam"
        - $ref: "#/components/parameters/TemplateID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PodTemplateInput"
      responses:
        "200":
          description: Private template updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PodTemplate"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags:
        - KPod
        - Endpoints
      summary: Delete a private template
      description: Deletes the template only if it belongs to the caller's account.
      operationId: deletePrivateTemplate
      parameters:
        - $ref: "#/components/parameters/ServiceParam"
        - $ref: "#/components/parameters/TemplateID"
      responses:
        "204":
          description: Private template deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /omni/kpod/v1/portinventory:
    post:
      tags:
        - KPod
      summary: Populate port inventory (internal)
      operationId: populatePortInventory
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Port inventory populated
  /omni/kpod/v1/podports/{id}:
    get:
      tags:
        - KPod
      summary: Get port mapping for a pod
      operationId: getPortMapping
      parameters:
        - $ref: "#/components/parameters/PodID"
      responses:
        "200":
          description: Port mapping retrieved
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /omni/sandbox/v1/sandbox:
    get:
      tags:
        - Sandbox
      summary: List sandboxes
      description: |
        Returns all sandboxes for the authenticated account.
        Supports optional region, status, and name filtering and pagination.
      operationId: listSandboxes
      parameters:
        - $ref: "#/components/parameters/QueryRegion"
        - $ref: "#/components/parameters/QueryStatus"
        - $ref: "#/components/parameters/QueryName"
        - $ref: "#/components/parameters/QueryPage"
        - $ref: "#/components/parameters/QueryLimit"
      responses:
        "200":
          description: Sandboxes retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListSandboxesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags:
        - Sandbox
      summary: Create a sandbox
      description: |
        Provisions an isolated sandbox environment. Returns 202 Accepted.

        The runtime image is resolved server-side from the selected sandbox pod
        template; when no template is selected, the first sandbox-supported
        template is used. Deployment is asynchronous via Temporal workflow;
        status transitions: deploying → active (or failed_deploy).
      operationId: createSandbox
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSandboxRequest"
      responses:
        "202":
          description: Sandbox creation initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncSandboxResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /omni/sandbox/v1/template:
    get:
      tags:
        - Sandbox
      summary: List pod templates available for sandboxes
      description: Returns official pod templates visible to the sandbox service.
      operationId: listSandboxTemplates
      responses:
        "200":
          description: Sandbox templates retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PodTemplate"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /omni/sandbox/v1/sandbox/{id}:
    get:
      tags:
        - Sandbox
      summary: Get a sandbox by ID or KRN
      operationId: getSandbox
      parameters:
        - $ref: "#/components/parameters/SandboxID"
      responses:
        "200":
          description: Sandbox retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/SandboxResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags:
        - Sandbox
      summary: Delete a sandbox
      description: |
        Deletes a sandbox and its KNative service. Returns 202 Accepted.
        Soft-deletes the record after cleaning up cluster resources.
      operationId: deleteSandbox
      parameters:
        - $ref: "#/components/parameters/SandboxID"
      responses:
        "202":
          description: Sandbox deletion initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Sandbox is already being deleted
  /omni/sandbox/v1/sandbox/{id}/ttl:
    post:
      tags:
        - Sandbox
      summary: Set or extend the sandbox TTL
      description: |
        Resets the auto-expiry deadline to now + ttlSeconds (E2B setTimeout
        semantics — reset, not additive). Also arms a TTL on a sandbox created
        without one. The sandbox must be active.
      operationId: extendSandboxTTL
      parameters:
        - $ref: "#/components/parameters/SandboxID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - ttlSeconds
              properties:
                ttlSeconds:
                  type: integer
                  minimum: 60
                  maximum: 604800
                  description: New TTL; the deadline becomes now + ttlSeconds
      responses:
        "200":
          description: TTL updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      ttlSeconds:
                        type: integer
                      expiresAt:
                        type: string
                        format: date-time
                        description: Estimated deadline; the authoritative value appears on GET once persisted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Sandbox is not active
  /omni/sandbox/v1/sandbox/{id}/files:
    parameters:
      - $ref: "#/components/parameters/SandboxID"
      - name: path
        in: query
        required: true
        description: |
          File path inside the sandbox workspace (`/app`). Absolute or relative;
          traversal outside the workspace is rejected.
        schema:
          type: string
        example: /home/user/data.csv
    post:
      tags:
        - Sandbox
      summary: Upload a file to a sandbox
      description: |
        Uploads a file into a running sandbox. Parent directories are created
        and an existing file at the same path is overwritten (E2B semantics).

        The request is authenticated and ownership-checked, then proxied to the
        sandbox through the region's private local gateway. The sandbox must be
        `active`. Body is the raw file bytes; max 100 MB.
      operationId: uploadSandboxFile
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: File uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxFileResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Sandbox is not active
        "413":
          description: File exceeds the 100 MB limit
        "502":
          description: Sandbox is unreachable
        "503":
          description: Region is unavailable
    get:
      tags:
        - Sandbox
      summary: Download a file from a sandbox
      description: |
        Streams a file from a running sandbox. Authenticated, ownership-checked,
        and proxied through the region's private local gateway. The sandbox must
        be `active`.
      operationId: downloadSandboxFile
      responses:
        "200":
          description: File contents
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Sandbox is not active
        "502":
          description: Sandbox is unreachable
        "503":
          description: Region is unavailable
    delete:
      tags:
        - Sandbox
      summary: Delete a file from a sandbox
      description: |
        Removes a file or directory from a running sandbox. Authenticated,
        ownership-checked, and proxied through the region's private local
        gateway. The sandbox must be `active`.
      operationId: deleteSandboxFile
      responses:
        "200":
          description: File deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxFileResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Sandbox is not active
        "502":
          description: Sandbox is unreachable
        "503":
          description: Region is unavailable
  /omni/sandbox/v1/sandbox/{id}/files/list:
    get:
      tags:
        - Sandbox
      summary: List directory entries in a sandbox
      description: |
        Lists files and directories under `path` inside a running sandbox,
        up to `depth` levels deep (depth 1 = direct children only). Entries
        are sorted per directory, depth-first. The workspace root (``, `/`,
        or `/app`) is a valid `path`. Authenticated, ownership-checked, and
        proxied through the region's private local gateway. The sandbox must
        be `active`.
      operationId: listSandboxDir
      parameters:
        - $ref: "#/components/parameters/SandboxID"
        - $ref: "#/components/parameters/SandboxDirPath"
        - name: depth
          in: query
          required: false
          description: Levels of subdirectories to include (1 = direct children).
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 1
      responses:
        "200":
          description: Directory listed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxEntryListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Sandbox is not active
        "502":
          description: Sandbox is unreachable
        "503":
          description: Region is unavailable
  /omni/sandbox/v1/sandbox/{id}/files/stat:
    get:
      tags:
        - Sandbox
      summary: Get info about a file or directory in a sandbox
      description: |
        Returns EntryInfo (name, path, type, size, mode, modifiedTime) for a
        single path inside a running sandbox. The workspace root (``, `/`, or
        `/app`) is a valid `path`. Authenticated, ownership-checked, and
        proxied through the region's private local gateway. The sandbox must
        be `active`.
      operationId: statSandboxPath
      parameters:
        - $ref: "#/components/parameters/SandboxID"
        - $ref: "#/components/parameters/SandboxDirPath"
      responses:
        "200":
          description: Path info retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/SandboxEntryInfo"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Sandbox is not active
        "502":
          description: Sandbox is unreachable
        "503":
          description: Region is unavailable
  /omni/sandbox/v1/sandbox/{id}/files/move:
    put:
      tags:
        - Sandbox
      summary: Move or rename a file or directory in a sandbox
      description: |
        Renames `path` to `newPath` inside a running sandbox (rename
        semantics): destination parent directories are created and an
        existing destination file is overwritten. Authenticated,
        ownership-checked, and proxied through the region's private local
        gateway. The sandbox must be `active`.
      operationId: moveSandboxPath
      parameters:
        - $ref: "#/components/parameters/SandboxID"
        - name: path
          in: query
          required: true
          description: Source path inside the sandbox workspace (`/app`).
          schema:
            type: string
          example: /data/old-name.csv
        - name: newPath
          in: query
          required: true
          description: Destination path inside the sandbox workspace (`/app`).
          schema:
            type: string
          example: /data/new-name.csv
      responses:
        "200":
          description: Path moved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxFileResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Sandbox or source path not found
        "409":
          description: Sandbox is not active
        "502":
          description: Sandbox is unreachable
        "503":
          description: Region is unavailable
  /omni/sandbox/v1/sandbox/{id}/dirs:
    post:
      tags:
        - Sandbox
      summary: Create a directory in a sandbox
      description: |
        Creates the directory at `path` and any missing parent directories
        (mkdir -p semantics); succeeds if the directory already exists.
        Authenticated, ownership-checked, and proxied through the region's
        private local gateway. The sandbox must be `active`.
      operationId: makeSandboxDir
      parameters:
        - $ref: "#/components/parameters/SandboxID"
        - name: path
          in: query
          required: true
          description: |
            Directory path inside the sandbox workspace (`/app`). Absolute or
            relative; traversal outside the workspace is rejected.
          schema:
            type: string
          example: /data/inputs
      responses:
        "200":
          description: Directory created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxFileResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Sandbox is not active
        "502":
          description: Sandbox is unreachable
        "503":
          description: Region is unavailable
  /omni/sandbox/v1/sandbox/{id}/commands:
    post:
      tags:
        - Sandbox
      summary: Run a command in a sandbox
      description: |
        Synchronously executes a command inside a running sandbox via `bash -c`
        and returns stdout, stderr, and the exit code when it finishes
        (E2B `commands.run` foreground semantics). Optional working directory
        (inside the workspace `/app`), extra environment variables (plaintext
        values), and a timeout (default 60s, max 270s). Stdout and stderr are
        capped at 1 MiB each; `timedOut: true` with partial output and
        `exitCode: -1` when the timeout elapses. Background processes
        (`cmd &`) return immediately and keep running in the sandbox — use
        this to start servers, then expose them via the ports API.
        Authenticated, ownership-checked, and proxied through the region's
        private local gateway. The sandbox must be `active`.
      operationId: execSandboxCommand
      parameters:
        - $ref: "#/components/parameters/SandboxID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecSandboxCommandRequest"
      responses:
        "200":
          description: Command executed (exitCode reflects the command result)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxCommandResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Sandbox not found, or cwd does not exist
        "409":
          description: Sandbox is not active
        "502":
          description: Sandbox is unreachable
        "503":
          description: Region is unavailable
  /omni/sandbox/v1/{sandboxId}/{proxyPath}:
    description: |
      Transparent per-sandbox proxy entry point. Any request to
      /omni/sandbox/v1/{sandboxId}/... (where {sandboxId} is the sandbox UUID)
      is IAM-authenticated at APISIX, ownership-checked by the backend, and
      forwarded to whatever the sandbox pod serves — original method, query,
      and body preserved; the /omni/sandbox/v1/{sandboxId} prefix is stripped,
      so the sandbox receives the path rooted at /. All HTTP methods are
      supported. Request bodies are capped at 100 MB. The sandbox must be
      `active`. This entry point is not returned by the API — construct it
      from the sandbox id as documented here.
    get:
      tags:
        - Sandbox
      summary: Proxy a request to the sandbox (all methods supported)
      operationId: proxySandboxRequest
      parameters:
        - name: sandboxId
          in: path
          required: true
          description: Sandbox UUID
          schema:
            type: string
            format: uuid
        - name: proxyPath
          in: path
          required: true
          description: Path forwarded to the sandbox (rooted at / inside the sandbox)
          schema:
            type: string
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Sandbox is not active
        "413":
          description: Request body exceeds the 100 MB limit
        "502":
          description: Sandbox is unreachable
        "503":
          description: Region is unavailable
        default:
          description: Whatever the sandbox returns (status, headers, and body are passed through)
  /omni/sandbox/v1/sandbox/{id}/ports:
    post:
      tags:
        - Sandbox
      summary: Open a sandbox port
      description: |
        Provisions routing for a user HTTP port inside the sandbox (two-step
        model: open the port, then send traffic to
        `/omni/sandbox/v1/{id}/port/{port}/...`). Creates a per-port ClusterIP
        Service and HTTPRoute on the region's private local gateway via a
        Temporal workflow — poll `GET .../ports` until the port is `active`
        (typically 1–2 s). The in-sandbox process must listen on `0.0.0.0`.
        Ports 1024–65535; max 20 open ports per sandbox; HTTP/WebSocket only.
        Returns 200 if the port is already open. The sandbox must be `active`.
      operationId: openSandboxPort
      parameters:
        - $ref: "#/components/parameters/SandboxID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - port
              properties:
                port:
                  type: integer
                  minimum: 1024
                  maximum: 65535
                  example: 3000
      responses:
        "200":
          description: Port is already open
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxPortResponse"
        "202":
          description: Port provisioning initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxPortResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Sandbox is not active
    get:
      tags:
        - Sandbox
      summary: List open sandbox ports
      operationId: listSandboxPorts
      parameters:
        - $ref: "#/components/parameters/SandboxID"
      responses:
        "200":
          description: Ports fetched
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/SandboxPortInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /omni/sandbox/v1/sandbox/{id}/ports/{port}:
    delete:
      tags:
        - Sandbox
      summary: Close a sandbox port
      description: Tears down the per-port routing. Returns 202; the port row is removed once closed.
      operationId: closeSandboxPort
      parameters:
        - $ref: "#/components/parameters/SandboxID"
        - name: port
          in: path
          required: true
          schema:
            type: integer
      responses:
        "202":
          description: Port close initiated
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Sandbox or port not found
        "409":
          description: Sandbox not active, or port already closing
  /omni/functions/v1/secrets/{kind}:
    parameters:
      - $ref: "#/components/parameters/SecretKind"
    get:
      tags:
        - Secrets
      summary: List secret names for a kind
      description: |
        Returns the names of all secrets of the given kind owned by the
        calling account. Values are never returned by this endpoint.
      operationId: listSecrets
      responses:
        "200":
          description: List of secret names
          content:
            application/json:
              schema:
                type: object
                properties:
                  kind:
                    type: string
                    example: huggingface
                  secrets:
                    type: array
                    items:
                      type: string
                    example:
                      - my-hf-token
                      - alt-token
        "503":
          description: Secret backend not configured
    post:
      tags:
        - Secrets
      summary: Create a named secret
      description: |
        Stores a new secret of the given kind. The request body shape depends
        on `kind`: see `CreateDockerSecretRequest`, `CreateHuggingFaceSecretRequest`,
        `CreateKOSSecretRequest`. Secret values are written to Vault and never
        echoed back.
      operationId: createSecret
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/CreateDockerSecretRequest"
                - $ref: "#/components/schemas/CreateHuggingFaceSecretRequest"
                - $ref: "#/components/schemas/CreateKOSSecretRequest"
      responses:
        "201":
          description: Secret stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  kind:
                    type: string
                  message:
                    type: string
        "400":
          description: Invalid payload (bad name, missing fields)
        "404":
          description: Unknown secret kind
        "503":
          description: Secret backend not configured
  /omni/functions/v1/secrets/{kind}/{name}:
    parameters:
      - $ref: "#/components/parameters/SecretKind"
      - name: name
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-z0-9]([a-z0-9\-]{0,61}[a-z0-9])?$
        description: "Secret name (lowercase alphanumeric with optional hyphens, 1\u201363 chars)"
    get:
      tags:
        - Secrets
      summary: Get secret metadata
      description: |
        Returns non-sensitive metadata for a single secret. Tokens, passwords,
        and secret keys are NEVER returned. For Docker secrets the username
        and authType are surfaced so the UI can show what kind of credential
        is stored.
      operationId: getSecret
      responses:
        "200":
